services:
  postgres:
    image: postgres:16-alpine
    container_name: truckerpoints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: truckerpoints
      POSTGRES_PASSWORD: truckerpoints
      POSTGRES_DB: truckerpoints
    ports:
      # Host port is overridable: this machine may already run a native PostgreSQL.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U truckerpoints -d truckerpoints']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
